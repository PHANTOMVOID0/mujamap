<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mouza Map Gallery — mouzamap.tech</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Karla:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f0e; --surface: #161a18; --border: #2a2f2d;
    --accent: #c8a96e; --accent2: #7eb89a;
    --text: #e8e4dc; --muted: #7a7f7c;
    --overlay: rgba(13,15,14,0.94);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Karla', sans-serif; min-height: 100vh; overflow-x: hidden; }

  header {
    padding: 2.5rem 2rem 1.5rem; border-bottom: 1px solid var(--border);
    position: sticky; top: 0; background: var(--overlay);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    z-index: 100; display: flex; align-items: center;
    justify-content: space-between; flex-wrap: wrap; gap: 1rem;
  }
  .brand { display: flex; flex-direction: column; gap: 2px; }
  .brand-name { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 600; color: var(--accent); letter-spacing: .02em; line-height: 1; }
  .brand-sub  { font-size: 12px; color: var(--muted); font-weight: 300; letter-spacing: .1em; text-transform: uppercase; }
  .header-right { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
  .count-badge  { font-size: 12px; color: var(--muted); background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 4px 12px; white-space: nowrap; }
  .count-badge span { color: var(--accent2); font-weight: 500; }

  .controls {
    padding: 1rem 2rem; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    border-bottom: 1px solid var(--border); background: var(--surface);
  }
  .search-wrap { position: relative; flex: 1; min-width: 180px; max-width: 340px; }
  .search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  #searchInput {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-family: 'Karla', sans-serif;
    font-size: 14px; padding: 8px 12px 8px 34px; outline: none; transition: border-color .2s;
  }
  #searchInput:focus { border-color: var(--accent); }
  #searchInput::placeholder { color: var(--muted); }

  .grid-toggle { display: flex; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .grid-toggle button { background: transparent; border: none; color: var(--muted); padding: 7px 11px; cursor: pointer; transition: background .15s, color .15s; line-height: 0; }
  .grid-toggle button.active { background: var(--accent); color: var(--bg); }
  .grid-toggle button:hover:not(.active) { background: var(--border); color: var(--text); }
  #resultCount { font-size: 12px; color: var(--muted); white-space: nowrap; }

  /* ── GALLERY GRID ── */
  #gallery { padding: 1.5rem 1.5rem 4rem; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
  #gallery.grid-lg { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  #gallery.grid-sm { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 6px; }

  /* ── CARD ── */
  .thumb {
    position: relative; aspect-ratio: 4/3; overflow: hidden;
    border-radius: 6px; background: var(--surface);
    border: 1px solid var(--border); cursor: pointer;
    transition: transform .18s, border-color .18s;
  }
  .thumb:hover { transform: scale(1.02); border-color: var(--accent); }

  /* skeleton — always in DOM, sits on top until image loads */
  .thumb .skel {
    position: absolute; inset: 0; z-index: 1;
    background: linear-gradient(90deg, var(--surface) 25%, var(--border) 50%, var(--surface) 75%);
    background-size: 200% 100%; animation: shimmer 1.4s infinite;
    transition: opacity .35s;
  }
  /* image loads → skeleton fades away */
  .thumb.loaded .skel { opacity: 0; pointer-events: none; }
  @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

  /* image is always in the DOM but invisible until .loaded */
  .thumb img {
    position: absolute; inset: 0; z-index: 0;
    width: 100%; height: 100%; object-fit: cover; display: block;
    opacity: 0; transition: opacity .35s;
  }
  .thumb.loaded img { opacity: 1; }

  .thumb .label {
    position: absolute; bottom: 0; left: 0; right: 0; z-index: 2;
    padding: 20px 8px 6px;
    background: linear-gradient(transparent, rgba(0,0,0,.7));
    font-size: 11px; color: rgba(255,255,255,.85);
    font-weight: 400; letter-spacing: .03em;
    opacity: 0; transition: opacity .2s;
  }
  .thumb:hover .label { opacity: 1; }

  /* error state */
  .thumb .err {
    position: absolute; inset: 0; z-index: 2; display: none;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 6px; font-size: 11px; color: #555; padding: 8px; text-align: center;
  }
  .thumb.error .skel { display: none; }
  .thumb.error .err  { display: flex; }

  #empty { display: none; grid-column: 1/-1; padding: 4rem; text-align: center; color: var(--muted); }
  #empty p { font-size: 15px; }

  /* ── LIGHTBOX ── */
  #lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.95); z-index: 999; align-items: center; justify-content: center; flex-direction: column; }
  #lightbox.open { display: flex; }
  #lb-img-wrap { position: relative; max-width: 94vw; max-height: 84vh; display: flex; align-items: center; justify-content: center; }
  #lb-img { max-width: 94vw; max-height: 84vh; border-radius: 4px; display: block; box-shadow: 0 20px 80px rgba(0,0,0,.8); transition: opacity .2s; }
  #lb-img.loading { opacity: .3; }
  #lb-info { margin-top: 14px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; justify-content: center; }
  #lb-label  { font-family: 'Playfair Display', serif; font-size: 16px; color: var(--accent); }
  #lb-counter{ font-size: 12px; color: var(--muted); }
  .lb-btn { background: transparent; border: 1px solid var(--border); border-radius: 6px; color: var(--text); cursor: pointer; padding: 6px 10px; font-size: 12px; font-family: 'Karla', sans-serif; transition: background .15s, border-color .15s; display: flex; align-items: center; gap: 5px; white-space: nowrap; text-decoration: none; }
  .lb-btn:hover { background: var(--border); border-color: var(--accent); }
  .lb-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,.6); border: 1px solid var(--border); border-radius: 50%; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text); transition: background .15s, border-color .15s; z-index: 2; }
  .lb-nav:hover { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  #lb-prev { left: -58px; } #lb-next { right: -58px; }
  #lb-close { position: absolute; top: 14px; right: 18px; background: transparent; border: 1px solid var(--border); border-radius: 6px; color: var(--muted); font-size: 20px; cursor: pointer; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; transition: color .15s, border-color .15s; }
  #lb-close:hover { color: var(--text); border-color: var(--text); }

  @media(max-width:600px) {
    header { padding: 1.2rem 1rem 1rem; }
    .controls { padding: .75rem 1rem; }
    #gallery { padding: 1rem .75rem 3rem; gap: 6px; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
    #lb-prev { left: 6px; } #lb-next { right: 6px; }
    .lb-nav { width: 36px; height: 36px; }
  }
  footer { text-align: center; padding: 2rem; font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); }
  footer a { color: var(--accent2); text-decoration: none; }
</style>
</head>

// ── HELPERS ───────────────────────────────────────────────────────────────────
const label = f => f.replace(' - (www.mouzamap.tech).jpg','').trim();
const fullUrl  = f => BASE + '/BS_RS/'        + encodeURIComponent(f);
const thumbUrl = f => BASE + '/BS_RS_THUMBS/' + encodeURIComponent(f);

// ── STATE ─────────────────────────────────────────────────────────────────────
let filteredFiles = [...FILES];
let currentIndex  = 0;

const gallery     = document.getElementById('gallery');
const emptyEl     = document.getElementById('empty');
const resultCount = document.getElementById('resultCount');

// ── INTERSECTION OBSERVERS ────────────────────────────────────────────────────
//
//  loadObserver   → fires when a card enters viewport + 600px buffer → sets
//                   img.src and triggers the fade-in via the .loaded class.
//
//  unloadObserver → declared but intentionally inert. Previously it cleared
//                   img.src when cards left the viewport, which caused already-
//                   rendered images to blank out and show the shimmer skeleton
//                   again. That behaviour is removed: images stay loaded once
//                   rendered so scrolling up reveals them instantly.
//
const loadObserver = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (!e.isIntersecting) return;
    const card = e.target;
    if (card.classList.contains('error')) return;
    const img = card.querySelector('img');
    if (img && !img.src) img.src = card.dataset.thumb;
  });
}, { rootMargin: '600px' });

// unloadObserver is intentionally inert.
// Blanking img.src as cards leave the viewport caused loaded images to flash
// back to the shimmer skeleton, creating a jarring experience. Images are now
// kept in memory once loaded — browsers handle memory pressure on their own.
const unloadObserver = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) return;         // still in or near viewport → keep
    const card = e.target;
    if (card.classList.contains('error')) return;
    const img = card.querySelector('img');
    if (!img) return;
    // img.src = '';                       // REMOVED — do not blank loaded images
    // card.classList.remove('loaded');    // REMOVED — skeleton must not reappear
  });
}, { rootMargin: '-50px' });

// ── BUILD ONE CARD (skeleton only — no image src yet) ─────────────────────────
function createCard(f, idx) {
  const lbl = label(f);
  const div = document.createElement('div');
  div.className    = 'thumb';
  div.title        = 'Map ' + lbl;
  div.dataset.thumb = thumbUrl(f);   // observer reads this to set img.src

  const skel = document.createElement('div'); skel.className = 'skel';

  const img = document.createElement('img');
  img.alt = 'Map ' + lbl;
  // No referrerPolicy override — browser sends Referer so R2 allows the request
  img.onload  = () => div.classList.add('loaded');
  img.onerror = () => {
    div.classList.add('error');
    div.querySelector('.err').style.display = 'flex';
  };

  const err = document.createElement('div');
  err.className = 'err';
  err.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3a3a3a" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 15l5-5 4 4 3-3 4 4"/></svg><span style="color:#444">' + lbl + '</span>';

  const lblEl = document.createElement('div');
  lblEl.className   = 'label';
  lblEl.textContent = lbl;

  div.appendChild(skel);
  div.appendChild(img);
  div.appendChild(err);
  div.appendChild(lblEl);

  div.addEventListener('click', () => openLightbox(idx));
  return div;
}

// ── RENDER ALL CARDS AT ONCE (only skeletons, no HTTP requests yet) ───────────
function renderGallery(files) {
  // Stop observing old cards before wiping the DOM
  gallery.querySelectorAll('.thumb').forEach(c => {
    loadObserver.unobserve(c);
  });
  gallery.innerHTML = '';
  emptyEl.style.display = files.length === 0 ? 'block' : 'none';
  resultCount.textContent = files.length === FILES.length ? '' : `${files.length} results`;

  const frag = document.createDocumentFragment();
  files.forEach((f, i) => {
    const card = createCard(f, i);
    frag.appendChild(card);
  });
  gallery.appendChild(frag);

  // Register every card with the load observer AFTER they're in the DOM
  gallery.querySelectorAll('.thumb').forEach(card => {
    loadObserver.observe(card);
  });
}

// ── SEARCH ────────────────────────────────────────────────────────────────────
let debounceTimer;
document.getElementById('searchInput').addEventListener('input', function() {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => {
    const q = this.value.trim().toLowerCase();
    filteredFiles = q ? FILES.filter(f => label(f).toLowerCase().includes(q)) : [...FILES];
    renderGallery(filteredFiles);
  }, 200);
});

// ── GRID TOGGLE ───────────────────────────────────────────────────────────────
function setGrid(size) {
  gallery.className = size === 'md' ? '' : 'grid-' + size;
  ['sm','md','lg'].forEach(s => document.getElementById('btn'+s.charAt(0).toUpperCase()+s.slice(1)).classList.toggle('active', s === size));
}

// ── LIGHTBOX ──────────────────────────────────────────────────────────────────
const lightbox  = document.getElementById('lightbox');
const lbImg     = document.getElementById('lb-img');
const lbLabel   = document.getElementById('lb-label');
const lbCounter = document.getElementById('lb-counter');
const lbDl      = document.getElementById('lb-dl');

function openLightbox(idx) {
  currentIndex = idx;
  showLbImage();
  lightbox.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function showLbImage() {
  const f = filteredFiles[currentIndex]; if (!f) return;
  const url = fullUrl(f);
  lbImg.classList.add('loading');
  lbImg.src = url;
  lbImg.onload = () => lbImg.classList.remove('loading');
  lbLabel.textContent   = 'Map ' + label(f);
  lbCounter.textContent = (currentIndex + 1) + ' / ' + filteredFiles.length;
  lbDl.href = url; lbDl.download = f;
}
function closeLightbox() { lightbox.classList.remove('open'); document.body.style.overflow = ''; }

document.getElementById('lb-prev').addEventListener('click', e => { e.stopPropagation(); currentIndex = (currentIndex - 1 + filteredFiles.length) % filteredFiles.length; showLbImage(); });
document.getElementById('lb-next').addEventListener('click', e => { e.stopPropagation(); currentIndex = (currentIndex + 1) % filteredFiles.length; showLbImage(); });
document.getElementById('lb-close').addEventListener('click', closeLightbox);
lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });

document.addEventListener('keydown', e => {
  if (!lightbox.classList.contains('open')) return;
  if (e.key === 'ArrowLeft')  { currentIndex = (currentIndex - 1 + filteredFiles.length) % filteredFiles.length; showLbImage(); }
  if (e.key === 'ArrowRight') { currentIndex = (currentIndex + 1) % filteredFiles.length; showLbImage(); }
  if (e.key === 'Escape') closeLightbox();
});

function copyLink() {
  navigator.clipboard.writeText(fullUrl(filteredFiles[currentIndex])).then(() => {
    const btn = document.getElementById('lb-copy-btn');
    const orig = btn.innerHTML;
    btn.textContent = 'Copied!';
    setTimeout(() => { btn.innerHTML = orig; }, 1800);
  });
}

let tx = 0;
lbImg.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
lbImg.addEventListener('touchend',   e => {
  const dx = e.changedTouches[0].clientX - tx;
  if (Math.abs(dx) > 50) { currentIndex = dx < 0 ? (currentIndex+1)%filteredFiles.length : (currentIndex-1+filteredFiles.length)%filteredFiles.length; showLbImage(); }
}, { passive: true });

// ── INIT ──────────────────────────────────────────────────────────────────────
renderGallery(FILES);
</script>
