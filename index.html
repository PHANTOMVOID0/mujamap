<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mouza Map Gallery — mouzamap.tech</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Karla:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f0e;
    --surface: #161a18;
    --border: #2a2f2d;
    --accent: #c8a96e;
    --accent2: #7eb89a;
    --text: #e8e4dc;
    --muted: #7a7f7c;
    --overlay: rgba(13,15,14,0.94);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Karla', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── HEADER ── */
  header {
    padding: 2.5rem 2rem 1.5rem;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--overlay);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 1rem;
  }

  .brand {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .brand-name {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: 0.02em;
    line-height: 1;
  }

  .brand-sub {
    font-size: 12px;
    color: var(--muted);
    font-weight: 300;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
  }

  .count-badge {
    font-size: 12px;
    color: var(--muted);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 12px;
    white-space: nowrap;
  }

  .count-badge span {
    color: var(--accent2);
    font-weight: 500;
  }

  /* ── SEARCH + FILTER BAR ── */
  .controls {
    padding: 1rem 2rem;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }

  .search-wrap {
    position: relative;
    flex: 1;
    min-width: 180px;
    max-width: 340px;
  }

  .search-wrap svg {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    pointer-events: none;
  }

  #searchInput {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'Karla', sans-serif;
    font-size: 14px;
    padding: 8px 12px 8px 34px;
    outline: none;
    transition: border-color 0.2s;
  }

  #searchInput:focus { border-color: var(--accent); }
  #searchInput::placeholder { color: var(--muted); }

  .grid-toggle {
    display: flex;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }

  .grid-toggle button {
    background: transparent;
    border: none;
    color: var(--muted);
    padding: 7px 11px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
    line-height: 0;
  }

  .grid-toggle button.active {
    background: var(--accent);
    color: var(--bg);
  }

  .grid-toggle button:hover:not(.active) { background: var(--border); color: var(--text); }

  #resultCount {
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
  }

  /* ── GALLERY GRID ── */
  #gallery {
    padding: 1.5rem 1.5rem 4rem;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 10px;
    transition: grid-template-columns 0.2s;
  }

  #gallery.grid-lg { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  #gallery.grid-sm { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 6px; }

  .thumb {
    position: relative;
    aspect-ratio: 4/3;
    overflow: hidden;
    border-radius: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    cursor: pointer;
    transition: transform 0.18s, border-color 0.18s;
  }

  .thumb:hover { transform: scale(1.02); border-color: var(--accent); }

  .thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: opacity 0.3s;
  }

  .thumb img.loading { opacity: 0; }
  .thumb img.loaded  { opacity: 1; }

  .thumb .label {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 20px 8px 6px;
    background: linear-gradient(transparent, rgba(0,0,0,0.7));
    font-size: 11px;
    color: rgba(255,255,255,0.85);
    font-weight: 400;
    letter-spacing: 0.03em;
    opacity: 0;
    transition: opacity 0.2s;
  }

  .thumb:hover .label { opacity: 1; }

  /* placeholder skeleton */
  .thumb .skel {
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, var(--surface) 25%, var(--border) 50%, var(--surface) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
  }

  @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

  /* ── LIGHTBOX ── */
  #lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.95);
    z-index: 999;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }

  #lightbox.open { display: flex; }

  #lb-img-wrap {
    position: relative;
    max-width: 94vw;
    max-height: 84vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #lb-img {
    max-width: 94vw;
    max-height: 84vh;
    border-radius: 4px;
    display: block;
    box-shadow: 0 20px 80px rgba(0,0,0,0.8);
    transition: opacity 0.2s;
  }

  #lb-img.loading { opacity: 0.3; }

  #lb-info {
    margin-top: 14px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
  }

  #lb-label {
    font-family: 'Playfair Display', serif;
    font-size: 16px;
    color: var(--accent);
  }

  #lb-counter {
    font-size: 12px;
    color: var(--muted);
  }

  .lb-btn {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    cursor: pointer;
    padding: 6px 10px;
    font-size: 12px;
    font-family: 'Karla', sans-serif;
    transition: background 0.15s, border-color 0.15s;
    display: flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
  }

  .lb-btn:hover { background: var(--border); border-color: var(--accent); }

  .lb-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(0,0,0,0.6);
    border: 1px solid var(--border);
    border-radius: 50%;
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--text);
    transition: background 0.15s, border-color 0.15s;
    z-index: 2;
  }

  .lb-nav:hover { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  #lb-prev { left: -58px; }
  #lb-next { right: -58px; }

  #lb-close {
    position: absolute;
    top: 14px;
    right: 18px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--muted);
    font-size: 20px;
    cursor: pointer;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.15s, border-color 0.15s;
  }

  #lb-close:hover { color: var(--text); border-color: var(--text); }

  /* empty state */
  #empty {
    display: none;
    grid-column: 1/-1;
    padding: 4rem;
    text-align: center;
    color: var(--muted);
  }

  #empty p { font-size: 15px; }

  /* ── MOBILE ── */
  @media(max-width: 600px) {
    header { padding: 1.2rem 1rem 1rem; }
    .controls { padding: 0.75rem 1rem; }
    #gallery { padding: 1rem 0.75rem 3rem; gap: 6px; }
    #gallery { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
    #lb-prev { left: 6px; }
    #lb-next { right: 6px; }
    .lb-nav { width: 36px; height: 36px; }
  }

  footer {
    text-align: center;
    padding: 2rem;
    font-size: 12px;
    color: var(--muted);
    border-top: 1px solid var(--border);
  }
  footer a { color: var(--accent2); text-decoration: none; }
</style>
</head>

const gallery = document.getElementById('gallery');
const emptyEl = document.getElementById('empty');
const searchInput = document.getElementById('searchInput');
const resultCount = document.getElementById('resultCount');

let filteredFiles = [...FILES];
let currentIndex = 0;

function labelFromFile(f) {
  return f.replace(' - (www.mouzamap.tech).jpg', '').trim();
}

function urlFromFile(f) {
  return BASE + '/BS_RS/' + f.replace(/ /g, '%20');
}
function thumbFromFile(f) {
  return BASE + '/BS_RS_THUMBS/' + f.replace(/ /g, '%20');
}
// Intersection Observer for lazy loading
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      const img = entry.target.querySelector('img[data-src]');
      if (img) {
        img.src = img.dataset.src;
        img.removeAttribute('data-src');
        img.onload = () => { img.classList.remove('loading'); img.classList.add('loaded'); };
      }
      observer.unobserve(entry.target);
    }
  });
}, { rootMargin: '400px' });

function renderGallery(files) {
  gallery.innerHTML = '';
  emptyEl.style.display = files.length === 0 ? 'block' : 'none';
  resultCount.textContent = files.length === FILES.length ? '' : `${files.length} results`;

  files.forEach((f, i) => {
    const url = urlFromFile(f);
    const label = labelFromFile(f);

    const div = document.createElement('div');
    div.className = 'thumb';
    div.title = 'Map ' + label;

    const skel = document.createElement('div');
    skel.className = 'skel';
   const img = document.createElement('img');
    img.className = 'loading';
    img.loading = "lazy";
    img.decoding = "async";
    img.referrerPolicy = "no-referrer";
    img.dataset.src = thumbFromFile(f);
    img.alt = 'Map ' + label;
    img.onload = () => {
      img.classList.remove('loading');
      img.classList.add('loaded');
      skel.remove();
    };
    img.onerror = () => {
      skel.remove();
      img.style.display = 'none';
      const err = document.createElement('div');
      err.style.cssText = 'position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:11px;color:#555;padding:8px;text-align:center;';
      err.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3a3a3a" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 15l5-5 4 4 3-3 4 4"/></svg><span style="color:#444">' + label + '</span>';
      div.appendChild(err);
    };

    const lbl = document.createElement('div');
    lbl.className = 'label';
    lbl.textContent = label;

    div.appendChild(skel);
    div.appendChild(img);
    div.appendChild(lbl);

    div.addEventListener('click', () => openLightbox(i, files));
    gallery.appendChild(div);
    observer.observe(div);
  });
}

// Search
let debounceTimer;
searchInput.addEventListener('input', () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => {
    const q = searchInput.value.trim().toLowerCase();
    filteredFiles = q
      ? FILES.filter(f => labelFromFile(f).toLowerCase().includes(q))
      : [...FILES];
    renderGallery(filteredFiles);
  }, 200);
});

// Grid toggle
function setGrid(size) {
  gallery.className = size === 'md' ? '' : (size === 'lg' ? 'grid-lg' : 'grid-sm');
  document.getElementById('btnSm').classList.toggle('active', size === 'sm');
  document.getElementById('btnMd').classList.toggle('active', size === 'md');
  document.getElementById('btnLg').classList.toggle('active', size === 'lg');
}

// Lightbox
const lightbox = document.getElementById('lightbox');
const lbImg = document.getElementById('lb-img');
const lbLabel = document.getElementById('lb-label');
const lbCounter = document.getElementById('lb-counter');
const lbDl = document.getElementById('lb-dl');

function openLightbox(idx, files) {
  currentIndex = idx;
  showLbImage(files);
  lightbox.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function showLbImage(files) {
  const f = files ? files[currentIndex] : filteredFiles[currentIndex];
  const url = urlFromFile(f);
  lbImg.classList.add('loading');
  lbImg.src = url;
  lbImg.onload = () => lbImg.classList.remove('loading');
  lbLabel.textContent = 'Map ' + labelFromFile(f);
  lbCounter.textContent = (currentIndex + 1) + ' / ' + (files || filteredFiles).length;
  lbDl.href = url;
  lbDl.download = f;
}

document.getElementById('lb-prev').addEventListener('click', (e) => {
  e.stopPropagation();
  currentIndex = (currentIndex - 1 + filteredFiles.length) % filteredFiles.length;
  showLbImage();
});

document.getElementById('lb-next').addEventListener('click', (e) => {
  e.stopPropagation();
  currentIndex = (currentIndex + 1) % filteredFiles.length;
  showLbImage();
});

document.getElementById('lb-close').addEventListener('click', closeLightbox);
lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });

function closeLightbox() {
  lightbox.classList.remove('open');
  document.body.style.overflow = '';
}

document.addEventListener('keydown', (e) => {
  if (!lightbox.classList.contains('open')) return;
  if (e.key === 'ArrowLeft') { currentIndex = (currentIndex - 1 + filteredFiles.length) % filteredFiles.length; showLbImage(); }
  if (e.key === 'ArrowRight') { currentIndex = (currentIndex + 1) % filteredFiles.length; showLbImage(); }
  if (e.key === 'Escape') closeLightbox();
});

function copyLink() {
  const f = filteredFiles[currentIndex];
  navigator.clipboard.writeText(urlFromFile(f)).then(() => {
    const btn = document.querySelector('#lb-info .lb-btn:last-child');
    const orig = btn.innerHTML;
    btn.textContent = 'Copied!';
    setTimeout(() => btn.innerHTML = orig, 1800);
  });
}

// Touch swipe
let touchStartX = 0;
lbImg.addEventListener('touchstart', e => touchStartX = e.touches[0].clientX, {passive:true});
lbImg.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 50) {
    currentIndex = dx < 0
      ? (currentIndex + 1) % filteredFiles.length
      : (currentIndex - 1 + filteredFiles.length) % filteredFiles.length;
    showLbImage();
  }
}, {passive:true});

// Init
renderGallery(FILES);
let loaded = 80;

window.addEventListener('scroll', () => {
  if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 500) {
    const next = FILES.slice(loaded, loaded + 60);
    if (next.length === 0) return;

    loaded += 60;

    next.forEach((f, i) => {
      const url = urlFromFile(f);
      const label = labelFromFile(f);

      const div = document.createElement('div');
      div.className = 'thumb';

      const skel = document.createElement('div');
      skel.className = 'skel';

      const img = document.createElement('img');
      img.className = 'loading';
      img.loading = "lazy";
      img.decoding = "async";
      img.referrerPolicy = "no-referrer";
      img.dataset.src = thumbFromFile(f);

      img.onload = () => {
        img.classList.remove('loading');
        skel.remove();
      };

      div.appendChild(skel);
      div.appendChild(img);
      gallery.appendChild(div);
      observer.observe(div);
    });
  }
});
</script>
</body>
</html>
